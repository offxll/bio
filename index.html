<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>offxll // UNDERGROUND</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-red: #ff003c;
            --accent-green: #39ff14;
            --card-bg: #111111;
            --card-border: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body {
            background-color: var(--bg-color); color: var(--text-color); min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start; padding: 30px 15px;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; position: relative; overflow-x: hidden;
        }
        .top-bar { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .lang-btn { background: transparent; color: var(--text-color); border: 1px solid #444; padding: 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .lang-btn:hover { border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px rgba(57, 255, 20, 0.2); }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; }
        .tag { align-self: flex-start; border: 1px solid var(--accent-red); color: var(--accent-red); padding: 4px 10px; font-size: 12px; letter-spacing: 2px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(255, 0, 60, 0.2); }
        .title { font-family: 'Oswald', sans-serif; font-size: 42px; line-height: 1.1; text-transform: uppercase; margin-bottom: 10px; }
        .title .red { color: #fff; text-shadow: 2px 2px 0px var(--accent-red), -2px -2px 0px rgba(255,0,60,0.5); }
        .title .yellow { color: #fff; text-shadow: 2px 2px 0px #ffcc00, -2px -2px 0px rgba(255,204,0,0.5); }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 40px; border-left: 3px solid var(--accent-red); padding-left: 10px; }
        .links-container { display: flex; flex-direction: column; gap: 15px; }
        .link-card { background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 15px 20px; display: flex; align-items: center; text-decoration: none; color: var(--text-color); transition: all 0.2s ease; position: relative; overflow: hidden; }
        .link-card:hover { border-color: #444; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .link-card:hover .arrow { color: var(--accent-green); transform: translateX(3px); }
        .link-card::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px; background: var(--accent-red); opacity: 0; transition: 0.3s; }
        .link-card:hover::before { opacity: 1; }
        .icon-box { width: 45px; height: 45px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; display: flex; justify-content: center; align-items: center; font-size: 20px; margin-right: 15px; flex-shrink: 0; }
        .link-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .link-title { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 1px; margin-bottom: 3px; }
        .link-url { font-size: 12px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .arrow { color: #444; font-size: 18px; transition: 0.3s; }
        
        .settings-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: #111; border: 1px solid #333; color: #fff; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 999; transition: 0.3s; }
        .settings-btn:hover { background: #222; border-color: var(--accent-red); transform: rotate(90deg); }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #111; border: 1px solid #333; padding: 25px; border-radius: 10px; text-align: left; width: 95%; max-width: 400px; box-shadow: 0 0 30px rgba(255,0,60,0.1); max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { margin-bottom: 15px; font-size: 18px; letter-spacing: 1px; text-align: center; color: var(--accent-red); }
        .modal-content label { font-size: 12px; color: #888; display: block; margin-top: 10px; margin-bottom: 5px; }
        .modal-content input { width: 100%; padding: 10px; background: #000; border: 1px solid #333; color: #fff; margin-bottom: 10px; outline: none; font-family: monospace; }
        .modal-content input:focus { border-color: var(--accent-green); }
        .modal-content button { width: 100%; padding: 12px; background: var(--accent-red); color: #fff; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .modal-content button:hover { background: #d10031; }
        
        .edit-fields { display: none; margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; }
        .edit-fields.active { display: block; }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="lang-btn" id="langToggle" onclick="toggleLanguage()">УКР / РУС</button>
    </div>

    <div class="container">
        <div class="tag">// UNDERGROUND</div>
        <h1 class="title">
            <span class="red" id="mainTitle">ЗАГРУЗКА...</span><br>
            <span class="yellow" id="mainTitleUa"></span>
        </h1>
        <div class="subtitle" id="subTitle">...</div>

        <div class="links-container" id="linksContainer">
            <!-- Ссылки генерируются из JSON -->
        </div>
    </div>

    <div class="settings-btn" onclick="openAdminModal()">⚙️</div>

    <!-- Модалка Админа -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2>ВХОД ДЛЯ АДМИНА</h2>
            <label>Пароль от панели</label>
            <input type="password" id="adminPassword" placeholder="Пароль (по умолчанию admin123)">
            <button onclick="checkPassword()">ВОЙТИ</button>
            
            <div class="edit-fields" id="editFields">
                <label>GitHub Personal Access Token (для сохранения)</label>
                <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxx">
                <button onclick="saveToGitHub()" style="background: var(--accent-green); color: #000;">СОХРАНИТЬ ВСЕ НА САЙТЕ</button>
                <div id="status" style="margin-top: 10px; font-size: 12px; text-align: center;"></div>
            </div>
        </div>
    </div>

    <script>
        // ===== НАСТРОЙКИ =====
        const ADMIN_PASSWORD = "admin123"; 
        const GITHUB_USER = "offxll"; // Ваш никнейм на GitHub
        const GITHUB_REPO = "bio";    // Название репозитория
        
        let siteData = null;
        let currentLang = localStorage.getItem('siteLang') || 'ru';

        // ===== 1. ЗАГРУЗКА ДАННЫХ =====
        async function loadData() {
            try {
                const res = await fetch(`data.json?t=${Date.now()}`);
                siteData = await res.json();
                renderLinks();
                setLanguage(currentLang);
            } catch (e) {
                document.getElementById('linksContainer').innerHTML = `<p style="color:red">Ошибка загрузки данных.</p>`;
            }
        }

        // ===== 2. ОТРИСОВКА =====
        function renderLinks() {
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            
            siteData.links.forEach((link) => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "link-card";
                a.innerHTML = `
                    <div class="icon-box">${link.icon}</div>
                    <div class="link-content">
                        <div class="link-title" data-ru="${link.title_ru}" data-ua="${link.title_ua}">${link.title_ru}</div>
                        <div class="link-url">${link.display_url}</div>
                    </div>
                    <div class="arrow">→</div>
                `;
                container.appendChild(a);
            });
        }

        // ===== 3. ЯЗЫК =====
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            if(!siteData) return;

            document.querySelector('.red').innerText = lang === 'ru' ? siteData.title_ru : siteData.title_ua;
            document.querySelector('.yellow').innerText = lang === 'ru' ? 'МОЙ ДРУГ' : 'МІЙ ДРУГ';
            document.getElementById('subTitle').innerText = lang === 'ru' ? siteData.subtitle_ru : siteData.subtitle_ua;

            document.querySelectorAll('.link-title').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });
        }

        function toggleLanguage() {
            setLanguage(currentLang === 'ru' ? 'ua' : 'ru');
        }

        // ===== 4. АДМИН ПАНЕЛЬ =====
        function openAdminModal() {
            document.getElementById('adminModal').classList.add('active');
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('editFields').classList.add('active');
                const savedToken = localStorage.getItem('ghToken');
                if (savedToken) document.getElementById('ghToken').value = savedToken;
            } else {
                alert("Неверный пароль!");
            }
        }

        // ===== 5. СОХРАНЕНИЕ НА GITHUB =====
        async function saveToGitHub() {
            const token = document.getElementById('ghToken').value.trim();
            const statusEl = document.getElementById('status');
            
            if (!token) {
                statusEl.innerText = "Введите токен GitHub!";
                statusEl.style.color = "red";
                return;
            }

            localStorage.setItem('ghToken', token);
            statusEl.innerText = "Сохранение...";
            statusEl.style.color = "yellow";

            const path = "data.json";
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`;

            try {
                const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
                let sha = null;
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const jsonString = JSON.stringify(siteData, null, 2);
                const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Обновление через админ-панель",
                        content: contentEncoded,
                        sha: sha
                    })
                });

                if (putRes.ok) {
                    statusEl.innerText = "УСПЕШНО! Обновите страницу через 1 минуту.";
                    statusEl.style.color = "var(--accent-green)";
                } else {
                    const err = await putRes.json();
                    statusEl.innerText = `Ошибка: ${err.message}`;
                    statusEl.style.color = "red";
                }
            } catch (e) {
                statusEl.innerText = "Ошибка сети. Проверьте токен.";
                statusEl.style.color = "red";
            }
        }

        document.getElementById('adminModal').addEventListener('click', (e) => {
            if (e.target.id === 'adminModal') {
                document.getElementById('adminModal').classList.remove('active');
                document.getElementById('editFields').classList.remove('active');
            }
        });

        loadData();
    </script>
</body>
</html>
