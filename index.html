<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OBSIDIAN // Bio Constructor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-color: #050505; --text-main: #ffffff; --text-sub: #888888; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --glass-hover: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"); }

        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:#050505; display:flex; justify-content:center; align-items:center; z-index:99999; color:#fff; font-size:14px; transition:opacity 0.5s; }
        .hero-section { width: 100%; height: 55vh; position: relative; display: flex; justify-content: center; align-items: flex-start; }
        .hero-image { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; filter: grayscale(100%); }
        .hero-fade { position: absolute; bottom: 0; left: 0; width: 100%; height: 150px; background: linear-gradient(to top, var(--bg-color) 0%, rgba(5,5,5,0) 100%); pointer-events: none; }

        .main-content { width: 100%; max-width: 480px; padding: 0 20px 100px 20px; margin-top: -60px; position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center; }
        .top-bar { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .lang-btn { background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); color: #fff; border: 1px solid var(--glass-border); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; }

        .profile-info { text-align: center; margin-bottom: 35px; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .name-big { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
        .bio-container { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .bio-main { font-size: 15px; color: var(--text-main); font-weight: 400; letter-spacing: 0.5px; }
        .bio-sub { font-size: 12px; color: var(--text-sub); font-weight: 400; letter-spacing: 1px; text-transform: uppercase; }

        .links-list { width: 100%; display: flex; flex-direction: column; gap: 14px; }
        .link-card { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); text-decoration: none; color: var(--text-main); transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); position: relative; cursor: pointer; }
        .link-card:hover { background: var(--glass-hover); transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.3); }
        .link-left { display: flex; align-items: center; gap: 15px; width: 85%; }
        .icon-box { font-size: 22px; }
        .link-info { display: flex; flex-direction: column; overflow: hidden; }
        .link-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .link-desc { font-size: 12px; color: var(--text-sub); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .arrow { color: rgba(255,255,255,0.4); font-size: 18px; transition: 0.3s; }

        .copy-btn { background: rgba(255,255,255,0.1); border: none; border-radius: 6px; color: #fff; padding: 5px 8px; font-size: 12px; cursor: pointer; margin-left: 10px; }
        .action-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 24px; border-radius: 20px; cursor: pointer; font-size: 13px; margin-top: 20px; width: 100%; text-align: center; }

        .settings-btn { position: fixed; bottom: 30px; right: 30px; width: 55px; height: 55px; border-radius: 50%; background: rgba(20, 20, 20, 0.8); border: 1px solid var(--glass-border); color: #fff; font-size: 20px; display: none; justify-content: center; align-items: center; cursor: pointer; z-index: 999; backdrop-filter: blur(10px); }
        .settings-btn.visible { display: flex; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #0f0f11; border: 1px solid #333; padding: 25px; border-radius: 20px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .modal-content h2 { color: #fff; margin-bottom: 20px; font-weight: 600; font-size: 20px; text-align: center; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-family: sans-serif; }
        .input-group input:focus { outline: none; border-color: #fff; }
        
        .btn-primary { width: 100%; padding: 14px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 14px;}
        .btn-add { background: transparent; border: 1px dashed #444; color: #888; width: 100%; padding: 12px; margin-bottom: 15px; cursor: pointer; border-radius: 8px; }
        
        .admin-link-item { border: 1px solid #222; padding: 15px; margin-bottom: 15px; position: relative; border-radius: 10px; background: #161618; }
        .btn-delete { position: absolute; top: 10px; right: 10px; background: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        .admin-actions { display: flex; gap: 10px; margin-top: 20px; }
        .admin-actions button { flex: 1; }
        .btn-cancel { background: #222; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        #browser-warning { display: none; background: #111; color: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #333; font-size: 13px; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; }
        .edit-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 8px 16px; border-radius: 12px; font-size: 12px; cursor: pointer; margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; }

        .hint-text { font-size: 11px; color: #444; text-align: center; margin-top: 40px; line-height: 1.5; display: none; }
        .hint-text b { color: #777; }
    </style>
</head>
<body>
    <div id="loader">Загрузка системы...</div>
    <div id="browser-warning">Вы в браузере соцсети. Для корректного перехода нажмите <b>(...)</b> и выберите <b>«Открыть в браузере»</b>.</div>
    <div class="top-bar"><button class="lang-btn" onclick="toggleLanguage()">RU</button></div>

    <div class="hero-section">
        <img src="" id="heroImage" class="hero-image" alt="Profile Photo">
        <div class="hero-fade"></div>
    </div>

    <div class="main-content">
        <div class="profile-info">
            <h1 class="name-big" id="profileName" onclick="handleSecretTap()">MOLODOY</h1>
            <div class="bio-container" id="profileBioContainer">
                <div class="bio-main" id="bioMain">теневая экономика души</div>
                <div class="bio-sub" id="bioSub">мои сети ниже</div>
            </div>
            <button class="edit-btn" id="editMyPageBtn" style="display:none;" onclick="requestEditPassword()">✏️ Редактировать</button>
        </div>

        <div class="links-list" id="linksContainer"></div>
        
        <button id="createBtn" onclick="openCreatorModal()" class="action-btn" style="display:none;">
            Создать свою страницу
        </button>

        <div class="hint-text" id="secretHint">
            Твоя страница защищена.<br>
            Чтобы появилась кнопка редактирования, <b>нажми 5 раз на свое имя</b> вверху.
        </div>
    </div>

    <div class="settings-btn" id="adminGear" onclick="openAdminModal()">⚙️</div>
    <div class="modal" id="adminModal"><div class="modal-content" id="modalContent"></div></div>

    <!-- 1. Классические скрипты Firebase (без модулей) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        const ADMIN_PASSWORD = "admin123"; 
        let siteData = null;
        let currentLang = localStorage.getItem('siteLang') || 'ru';
        let currentUserId = null;
        let pagePassword = null; 
        let isCreator = false;
        let db, auth;

        var ua = navigator.userAgent || navigator.vendor || window.opera;
        if (ua.indexOf("TikTok") > -1 || ua.indexOf("Instagram") > -1 || ua.indexOf("FBAN") > -1) {
            document.getElementById('browser-warning').style.display = 'block';
        }

        // ===== 1. ИНИЦИАЛИЗАЦИЯ FIREBASE =====
        const firebaseConfig = {
            apiKey: "AIzaSyCMj2Ao9IGDU2tfLru9vKHiHiiZCVBp66w",
            authDomain: "offxll-bio.firebaseapp.com",
            projectId: "offxll-bio",
            storageBucket: "offxll-bio.firebasestorage.app",
            messagingSenderId: "1083570296924",
            appId: "1:1083570296924:web:c0da8ac1a6abf935cd6e99"
        };

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            initApp();
        } catch (e) {
            console.error("Firebase init error:", e);
            document.getElementById('loader').innerText = "Ошибка подключения к БД";
        }

        async function initApp() {
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    try { await auth.signInAnonymously(); } catch(e) { console.error(e); }
                }

                const urlParams = new URLSearchParams(window.location.search);
                const userId = urlParams.get('u'); 

                if (userId) {
                    currentUserId = userId;
                    try {
                        const docRef = db.collection("pages").doc(userId);
                        const docSnap = await docRef.get();
                        
                        if (docSnap.exists) {
                            siteData = docSnap.data();
                            pagePassword = siteData.password || null;

                            if (siteData.ownerId === user.uid) {
                                isCreator = true;
                                if (siteData.password) {
                                    document.getElementById('secretHint').style.display = 'block';
                                } else {
                                    document.getElementById('editMyPageBtn').style.display = 'inline-flex';
                                }
                            }
                        } else {
                            alert("Страница не найдена!");
                            window.location.href = window.location.pathname; 
                        }
                    } catch (e) { console.error("Ошибка загрузки:", e); }
                } else {
                    try {
                        const res = await fetch(`data.json?t=${Date.now()}`);
                        siteData = await res.json();
                        document.getElementById('createBtn').style.display = 'block';
                        isCreator = true;
                    } catch (e) { console.error(e); }
                }
                renderUI();
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').style.display = 'none', 500);
            });
        }

        // ===== 2. ОТРИСОВКА =====
        function renderUI() {
            if(!siteData) return;
            if(siteData.profile) {
                document.getElementById('heroImage').src = siteData.profile.avatar || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop";
                document.getElementById('profileName').innerText = siteData.profile.name;
                
                const parts = (siteData.profile.bio || "").split('.');
                if (parts.length > 1) {
                    document.getElementById('bioMain').innerText = parts[0].trim();
                    document.getElementById('bioSub').innerText = parts.slice(1).join('.').trim();
                } else {
                    document.getElementById('bioMain').innerText = siteData.profile.bio || "";
                    document.getElementById('bioSub').innerText = ""; 
                }
            }

            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            siteData.links.forEach((link) => {
                const isTelegram = link.url.includes('t.me/');
                const div = document.createElement('div');
                div.className = "link-card";
                div.innerHTML = `
                    <div class="link-left">
                        <div class="icon-box">${link.icon}</div>
                        <div class="link-info">
                            <div class="link-title" data-ru="${link.title_ru}" data-ua="${link.title_ua}">${link.title_ru}</div>
                            <div class="link-desc">${link.display_url}</div>
                        </div>
                    </div>
                    ${isTelegram ? '<button class="copy-btn">📋</button>' : '<div class="arrow">→</div>'}
                `;
                div.onclick = (e) => {
                    if (e.target.classList.contains('copy-btn')) {
                        e.stopPropagation(); navigator.clipboard.writeText(link.url); e.target.innerText='✅'; setTimeout(()=>e.target.innerText='📋', 1500); return;
                    }
                    window.open(link.url, '_blank');
                };
                container.appendChild(div);
            });
            setLanguage(currentLang);
        }

        function setLanguage(lang) {
            currentLang = lang; localStorage.setItem('siteLang', lang);
            document.querySelector('.lang-btn').innerText = lang.toUpperCase();
            document.querySelectorAll('.link-title').forEach(el => el.innerText = el.getAttribute(`data-${lang}`));
        }
        function toggleLanguage() { setLanguage(currentLang === 'ru' ? 'ua' : 'ru'); }

        // ===== 3. СЕКРЕТНЫЙ ВХОД =====
        let tapCount = 0; let tapTimer;
        function handleSecretTap() {
            if (!isCreator) return;
            tapCount++; clearTimeout(tapTimer);
            if (tapCount >= 5) {
                document.getElementById('adminGear').classList.add('visible'); 
                document.getElementById('editMyPageBtn').style.display = 'inline-flex'; 
                document.getElementById('secretHint').style.display = 'none'; 
                tapCount = 0;
            } else {
                tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
            }
        }

        // ===== 4. СОЗДАНИЕ СТРАНИЦЫ =====
        function openCreatorModal() {
            const modal = document.getElementById('adminModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('active');
            
            content.innerHTML = `
                <h2>Создать Bio</h2>
                <div class="input-group"><label>Ссылка на фото (URL)</label><input type="text" id="g-avatar" placeholder="https://..."></div>
                <div class="input-group"><label>Имя (Никнейм)</label><input type="text" id="g-name" placeholder="Твое имя"></div>
                <div class="input-group"><label>Описание</label><input type="text" id="g-bio" placeholder="статус. ссылки ниже"></div>
                
                <div class="admin-link-item">
                    <h3 style="font-size:12px; color:#888;">ПЕРВАЯ ССЫЛКА</h3>
                    <div class="input-group"><label>Название</label><input type="text" id="g-link-title" placeholder="TELEGRAM"></div>
                    <div class="input-group"><label>URL</label><input type="text" id="g-link-url" placeholder="https://t.me/username"></div>
                </div>

                <div class="admin-link-item" style="border-color: #4ade80;">
                    <div class="input-group"><label style="color: #4ade80;">Пароль (необязательно)</label><input type="password" id="g-pass" placeholder="Оставь пустым для открытого доступа"></div>
                </div>

                <div class="admin-actions" style="margin-top: 20px;">
                    <button class="btn-cancel" onclick="document.getElementById('adminModal').classList.remove('active')">Отмена</button>
                    <button class="btn-primary" id="saveGuestBtn" onclick="saveGuestPage()">Создать</button>
                </div>
            `;
        }

        async function saveGuestPage() {
            const btn = document.getElementById('saveGuestBtn');
            const pass = document.getElementById('g-pass').value;
            btn.innerText = "Сохранение..."; btn.disabled = true;

            const newId = Math.random().toString(36).substring(2, 8);
            const user = auth.currentUser;

            const newData = {
                ownerId: user ? user.uid : "unknown",
                password: pass || null, 
                profile: {
                    avatar: document.getElementById('g-avatar').value || "",
                    name: document.getElementById('g-name').value || "Без имени",
                    bio: document.getElementById('g-bio').value || "Моя страница"
                },
                title_ru: "ПРИВЕТ", title_ua: "ПРІВІТ",
                links: [{ icon: "🔗", title_ru: document.getElementById('g-link-title').value || "ССЫЛКА", title_ua: document.getElementById('g-link-title').value || "ССЫЛКА", url: document.getElementById('g-link-url').value || "https://", display_url: document.getElementById('g-link-url').value.replace('https://','') || "link" }]
            };

            try {
                await db.collection("pages").doc(newId).set(newData);
                const baseUrl = window.location.origin + window.location.pathname;
                const finalUrl = `${baseUrl}?u=${newId}`;
                
                document.getElementById('modalContent').innerHTML = `
                    <h2 style="color:#4ade80">Успешно!</h2>
                    <p style="text-align:center; font-size:14px; color:#ccc; margin-bottom:20px;">Страница создана.</p>
                    <div class="input-group"><label>Твоя ссылка:</label><input type="text" value="${finalUrl}" readonly onclick="this.select()"></div>
                    ${pass ? `<div class="input-group"><label style="color:#4ade80;">Твой пароль:</label><input type="text" value="${pass}" readonly></div>` : ''}
                    <button class="btn-primary" onclick="navigator.clipboard.writeText('${finalUrl}'); this.innerText='Скопировано!'; setTimeout(()=>this.innerText='Скопировать ссылку', 1500)">Скопировать ссылку</button>
                    <button class="btn-cancel" style="width:100%; margin-top:10px;" onclick="window.location.href='${finalUrl}'">Перейти</button>
                `;
            } catch (e) { alert("Ошибка!"); btn.innerText = "Создать"; btn.disabled = false; }
        }

        // ===== 5. РЕДАКТИРОВАНИЕ СВОЕЙ СТРАНИЦЫ =====
        function requestEditPassword() {
            const modal = document.getElementById('adminModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('active');
            
            if (pagePassword) {
                content.innerHTML = `
                    <h2>Вход</h2>
                    <div class="input-group"><input type="password" id="edit-pass-input" placeholder="Введи свой пароль"></div>
                    <button class="btn-primary" onclick="checkEditPassword()">Войти</button>
                    <div id="authError" style="color:#ff4d4d; text-align:center; margin-top:10px;"></div>
                `;
                document.getElementById('edit-pass-input').focus();
            } else {
                renderEditForm();
            }
        }

        function checkEditPassword() {
            const pass = document.getElementById('edit-pass-input').value;
            if (pass === pagePassword) { 
                renderEditForm(); 
                document.getElementById('secretHint').style.display = 'none';
            } 
            else { document.getElementById('authError').innerText = "Неверный пароль!"; }
        }

        function renderEditForm() {
            const content = document.getElementById('modalContent');
            let linksHtml = '';
            siteData.links.forEach((link, index) => {
                linksHtml += `
                    <div class="admin-link-item">
                        <button class="btn-delete" onclick="deleteLink(${index})">Удалить</button>
                        <div class="input-group"><label>Иконка</label><input type="text" value="${link.icon}" oninput="updateField(${index}, 'icon', this.value)"></div>
                        <div class="input-group"><label>Название</label><input type="text" value="${link.title_ru}" oninput="updateField(${index}, 'title_ru', this.value); updateField(${index}, 'title_ua', this.value)"></div>
                        <div class="input-group"><label>URL</label><input type="text" value="${link.url}" oninput="updateField(${index}, 'url', this.value)"></div>
                    </div>
                `;
            });

            content.innerHTML = `
                <h2>Редактирование</h2>
                <div class="admin-link-item" style="border-color: #fff;">
                    <div class="input-group"><label>Фото (URL)</label><input type="text" value="${siteData.profile.avatar}" oninput="siteData.profile.avatar = this.value"></div>
                    <div class="input-group"><label>Имя</label><input type="text" value="${siteData.profile.name}" oninput="siteData.profile.name = this.value"></div>
                    <div class="input-group"><label>Био</label><input type="text" value="${siteData.profile.bio}" oninput="siteData.profile.bio = this.value"></div>
                </div>
                
                <div class="input-group">
                    <label style="color:#4ade80;">Пароль страницы (оставь пустым, чтобы убрать)</label>
                    <input type="text" id="e-pass" value="${pagePassword || ''}" placeholder="Пароль">
                </div>

                <div style="max-height: 30vh; overflow-y: auto; padding-right:5px;" id="edit-links-list">${linksHtml}</div>
                <button class="btn-add" onclick="addNewLink()">+ Добавить ссылку</button>
                
                <div class="admin-actions">
                    <button class="btn-cancel" onclick="document.getElementById('adminModal').classList.remove('active')">Отмена</button>
                    <button class="btn-primary" onclick="saveMyChanges()">Сохранить</button>
                </div>
                <div id="status" style="margin-top: 15px; font-size: 14px; text-align: center;"></div>
            `;
        }

        function updateField(index, field, value) { siteData.links[index][field] = value; }
        function deleteLink(index) { if(confirm("Удалить?")) { siteData.links.splice(index, 1); renderEditForm(); } }
        function addNewLink() {
            siteData.links.push({ icon: "🔗", title_ru: "НОВАЯ", title_ua: "НОВА", url: "https://", display_url: "link" });
            renderEditForm();
        }

        async function saveMyChanges() {
            const statusEl = document.getElementById('status');
            statusEl.innerText = "Сохранение..."; statusEl.style.color = "#fff";
            
            const newPass = document.getElementById('e-pass').value.trim();

            try {
                await db.collection("pages").doc(currentUserId).update({ 
                    profile: siteData.profile, 
                    links: siteData.links,
                    password: newPass || null
                });
                statusEl.innerText = "УСПЕШНО!"; statusEl.style.color = "#4ade80";
                setTimeout(() => { document.getElementById('adminModal').classList.remove('active'); window.location.reload(); }, 1500);
            } catch (e) { statusEl.innerText = "Ошибка."; statusEl.style.color = "#ff4d4d"; }
        }

        // ===== 6. ТВОЯ ЛИЧНАЯ АДМИНКА =====
        function openAdminModal() {
            const modal = document.getElementById('adminModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('active');
            content.innerHTML = `
                <h2>Вход в систему</h2>
                <div class="input-group"><input type="password" id="adminPassword" placeholder="Пароль" style="text-align:center;"></div>
                <button class="btn-primary" onclick="checkPassword()">Войти</button>
                <div id="authError" style="color:#ff4d4d; text-align:center; margin-top:10px;"></div>
            `;
            document.getElementById('adminPassword').focus();
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASSWORD) { renderAdminForm(); } 
            else { document.getElementById('authError').innerText = "Неверный пароль!"; }
        }

        function renderAdminForm() {
            const content = document.getElementById('modalContent');
            let linksHtml = '';
            siteData.links.forEach((link, index) => {
                linksHtml += `
                    <div class="admin-link-item">
                        <button class="btn-delete" onclick="deleteLink(${index})">Удалить</button>
                        <div class="input-group"><label>Иконка</label><input type="text" value="${link.icon}" oninput="updateField(${index}, 'icon', this.value)"></div>
                        <div class="input-group"><label>Название (RU)</label><input type="text" value="${link.title_ru}" oninput="updateField(${index}, 'title_ru', this.value)"></div>
                        <div class="input-group"><label>URL</label><input type="text" value="${link.url}" oninput="updateField(${index}, 'url', this.value)"></div>
                    </div>
                `;
            });
            content.innerHTML = `
                <h2>Твоя админка</h2>
                <div class="input-group"><label>GitHub Токен (data.json)</label><input type="password" id="ghToken" value="${localStorage.getItem('ghToken') || ''}"></div>
                <div style="max-height: 40vh; overflow-y: auto; padding-right:5px; margin-top:15px;">${linksHtml}</div>
                <div class="admin-actions">
                    <button class="btn-cancel" onclick="document.getElementById('adminModal').classList.remove('active')">Отмена</button>
                    <button class="btn-primary" onclick="saveToGitHub()">Сохранить</button>
                </div>
                <div id="status" style="margin-top: 15px; font-size: 14px; text-align: center;"></div>
            `;
        }

        async function saveToGitHub() {
            const token = document.getElementById('ghToken').value.trim();
            const statusEl = document.getElementById('status');
            if (!token) { statusEl.innerText = "Введите токен!"; statusEl.style.color = "red"; return; }
            localStorage.setItem('ghToken', token);
            statusEl.innerText = "Сохранение..."; statusEl.style.color = "#fff";
            const apiUrl = `https://api.github.com/repos/offxll/bio/contents/data.json`;
            try {
                const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
                let sha = getRes.ok ? (await getRes.json()).sha : null;
                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(siteData, null, 2))));
                const putRes = await fetch(apiUrl, { method: "PUT", headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" }, body: JSON.stringify({ message: "Update data", content: contentEncoded, sha: sha }) });
                if (putRes.ok) { statusEl.innerText = "УСПЕШНО!"; statusEl.style.color = "#4ade80"; setTimeout(() => { document.getElementById('adminModal').classList.remove('active'); window.location.reload(); }, 1500); } 
                else { statusEl.innerText = "Ошибка токена"; statusEl.style.color = "#ff4d4d"; }
            } catch (e) { statusEl.innerText = "Ошибка сети"; statusEl.style.color = "#ff4d4d"; }
        }
    </script>
</body>
</html>
