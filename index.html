<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>offxll // OBSIDIAN</title>
    <!-- Премиальный шрифт Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-main: #ffffff;
            --text-sub: #a1a1a6;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-hover: rgba(255, 255, 255, 0.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        /* --- БОЛЬШАЯ ФОТОГРАФИЯ СВЕРХУ --- */
        .hero-section {
            width: 100%;
            height: 55vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
        }

        .hero-fade {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(to top, var(--bg-color) 0%, rgba(5,5,5,0) 100%);
            pointer-events: none;
        }

        /* --- КОНТЕНТ --- */
        .main-content {
            width: 100%;
            max-width: 480px;
            padding: 0 20px 100px 20px;
            margin-top: -60px;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .top-bar { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .lang-btn { 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
            color: #fff; border: 1px solid var(--glass-border); 
            padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: 0.3s; 
        }
        .lang-btn:hover { background: var(--glass-bg); border-color: #fff; }

        .profile-info { text-align: center; margin-bottom: 35px; }
        
        .name-big { 
            font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 5px; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .bio { 
            font-size: 15px; color: var(--text-sub); font-weight: 400; letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* --- СТЕКЛЯННЫЕ КНОПКИ --- */
        .links-list { width: 100%; display: flex; flex-direction: column; gap: 14px; }
        
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .link-card:hover {
            background: var(--glass-hover);
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .link-left { display: flex; align-items: center; gap: 15px; width: 85%; }
        
        .icon-box { font-size: 22px; }
        
        .link-info { display: flex; flex-direction: column; overflow: hidden; }
        .link-title { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
        .link-desc { font-size: 12px; color: var(--text-sub); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .arrow { color: rgba(255,255,255,0.4); font-size: 18px; transition: 0.3s; }
        .link-card:hover .arrow { color: #fff; transform: translateX(3px); }

        /* Иконка копирования для ТГ */
        .copy-btn {
            background: rgba(255,255,255,0.1);
            border: none; border-radius: 6px;
            color: #fff; padding: 5px 8px;
            font-size: 12px; cursor: pointer;
            margin-left: 10px; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.3); }

        /* Кнопка настроек */
        .settings-btn { 
            position: fixed; bottom: 30px; right: 30px; 
            width: 55px; height: 55px; border-radius: 50%; 
            background: rgba(20, 20, 20, 0.8); border: 1px solid var(--glass-border); 
            color: #fff; font-size: 20px; display: flex; justify-content: center; align-items: center; 
            cursor: pointer; z-index: 999; backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .settings-btn:hover { background: #333; transform: rotate(90deg); }

        /* --- МОДАЛКА (АДМИНКА) --- */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { 
            background: #0f0f11; border: 1px solid #333; padding: 25px; 
            border-radius: 20px; width: 95%; max-width: 500px; max-height: 90vh; 
            overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); 
        }
        
        .modal-content h2 { color: #fff; margin-bottom: 20px; font-weight: 600; font-size: 20px; text-align: center; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
        .input-group input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-family: sans-serif; }
        .input-group input:focus { outline: none; border-color: #fff; }
        
        .btn-primary { width: 100%; padding: 14px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 14px;}
        .btn-primary:hover { background: #ccc; }
        
        .btn-add { background: transparent; border: 1px dashed #444; color: #888; width: 100%; padding: 12px; margin-bottom: 15px; cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .btn-add:hover { border-color: #fff; color: #fff; }
        
        .admin-link-item { border: 1px solid #222; padding: 15px; margin-bottom: 15px; position: relative; border-radius: 10px; background: #161618; }
        .btn-delete { position: absolute; top: 10px; right: 10px; background: transparent; color: #ff4d4d; border: 1px solid #ff4d4d; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background: #ff4d4d; color: #000; }
        
        .admin-actions { display: flex; gap: 10px; margin-top: 20px; }
        .admin-actions button { flex: 1; }
        .btn-cancel { background: #222; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        
        /* Баннер для соцсетей */
        #browser-warning { display: none; background: #111; color: #fff; padding: 15px; text-align: center; border-bottom: 1px solid #333; font-size: 13px; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; font-weight: 500; }
    </style>
</head>
<body>
    <div id="browser-warning">
        Вы в браузере соцсети. Для корректного перехода нажмите <b>(...)</b> и выберите <b>«Открыть в браузере»</b>.
    </div>

    <div class="top-bar">
        <button class="lang-btn" onclick="toggleLanguage()">RU</button>
    </div>

    <!-- Блок с большой фотографией -->
    <div class="hero-section">
        <img src="" id="heroImage" class="hero-image" alt="Profile Photo">
        <div class="hero-fade"></div>
    </div>

    <!-- Основной контент -->
    <div class="main-content">
        <div class="profile-info">
            <h1 class="name-big" id="profileName">offxll</h1>
            <div class="bio" id="profileBio">MONEY & CODE</div>
        </div>

        <div class="links-list" id="linksContainer"></div>
    </div>

    <!-- Кнопка настроек -->
    <div class="settings-btn" onclick="openAdminModal()">⚙️</div>

    <!-- Модалка -->
    <div class="modal" id="adminModal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123"; 
        const GITHUB_USER = "offxll"; 
        const GITHUB_REPO = "bio";    
        
        let siteData = null;
        let currentLang = localStorage.getItem('siteLang') || 'ru';

        // Проверка на WebView
        var ua = navigator.userAgent || navigator.vendor || window.opera;
        var isWebView = (ua.indexOf("TikTok") > -1 || ua.indexOf("Instagram") > -1 || ua.indexOf("FBAN") > -1);
        
        if (isWebView) {
            document.getElementById('browser-warning').style.display = 'block';
        }

        async function loadData() {
            try {
                const res = await fetch(`data.json?t=${Date.now()}`);
                siteData = await res.json();
                renderUI();
            } catch (e) {
                document.getElementById('linksContainer').innerHTML = `<p style="color:red;text-align:center;">ERROR: DATA_NOT_FOUND</p>`;
            }
        }

        function renderUI() {
            if(!siteData) return;
            
            // Загружаем профиль
            if(siteData.profile) {
                if(siteData.profile.avatar && siteData.profile.avatar !== "") {
                    document.getElementById('heroImage').src = siteData.profile.avatar;
                } else {
                    document.getElementById('heroImage').src = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop";
                }
                document.getElementById('profileName').innerText = siteData.profile.name;
                document.getElementById('profileBio').innerText = siteData.profile.bio;
            }

            // Загружаем ссылки
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            
            siteData.links.forEach((link, index) => {
                const isTelegram = link.url.includes('t.me/') || link.url.includes('telegram.me/');
                
                // Создаем обертку (div), а не ссылку (a), чтобы повесить кастомный клик
                const div = document.createElement('div');
                div.className = "link-card";
                
                // HTML внутри кнопки
                div.innerHTML = `
                    <div class="link-left">
                        <div class="icon-box">${link.icon}</div>
                        <div class="link-info">
                            <div class="link-title" data-ru="${link.title_ru}" data-ua="${link.title_ua}">${link.title_ru}</div>
                            <div class="link-desc">${link.display_url}</div>
                        </div>
                    </div>
                    ${isTelegram ? '<button class="copy-btn" title="Скопировать ссылку">📋</button>' : '<div class="arrow">→</div>'}
                `;

                // Логика клика по самой карточке
                div.addEventListener('click', function(e) {
                    // Если нажали на кнопку копирования - не переходим по ссылке
                    if (e.target.classList.contains('copy-btn')) {
                        e.stopPropagation();
                        navigator.clipboard.writeText(link.url).then(() => {
                            const originalText = e.target.innerText;
                            e.target.innerText = '✅';
                            setTimeout(() => e.target.innerText = originalText, 1500);
                        });
                        return;
                    }

                    // Логика для Телеграма
                    if (isTelegram) {
                        if (isWebView) {
                            // В ТИКТОКЕ: принудительно открываем веб-версию (без ошибок)
                            window.open(link.url, '_blank');
                        } else {
                            // В ОБЫЧНОМ БРАУЗЕРЕ: пытаемся открыть приложение
                            const username = link.url.split('/').pop().split('?')[0]; // достаем ник
                            const tgAppUrl = `tg://resolve?domain=${username}`;
                            
                            window.location.href = tgAppUrl;
                            
                            // Если приложение не открылось за 1.5 сек, открываем веб-версию
                            setTimeout(() => {
                                window.open(link.url, '_blank');
                            }, 1500);
                        }
                    } else {
                        // Обычные ссылки (Инст, ТТ и т.д.)
                        window.open(link.url, '_blank');
                    }
                });

                container.appendChild(div);
            });
            setLanguage(currentLang);
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            document.querySelector('.lang-btn').innerText = lang.toUpperCase();
            if(!siteData) return;
            document.querySelectorAll('.link-title').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });
        }
        function toggleLanguage() { setLanguage(currentLang === 'ru' ? 'ua' : 'ru'); }

        // ===== АДМИНКА =====
        function openAdminModal() {
            const modal = document.getElementById('adminModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('active');
            content.innerHTML = `
                <h2>Вход в систему</h2>
                <div class="input-group"><input type="password" id="adminPassword" placeholder="Пароль" style="text-align:center;"></div>
                <button class="btn-primary" onclick="checkPassword()">Войти</button>
            `;
            document.getElementById('adminPassword').focus();
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASSWORD) { renderAdminForm(); } 
            else { alert("Неверный пароль!"); }
        }

        function renderAdminForm() {
            const content = document.getElementById('modalContent');
            
            let profileHtml = `
                <div class="admin-link-item" style="border-color: #fff;">
                    <h3 style="margin-bottom: 10px; font-size: 14px; text-transform: uppercase;">Профиль</h3>
                    <div class="input-group"><label>Ссылка на фото (URL или avatar.jpg)</label><input type="text" value="${siteData.profile?.avatar || ''}" oninput="siteData.profile.avatar = this.value"></div>
                    <div class="input-group"><label>Имя (Никнейм)</label><input type="text" value="${siteData.profile?.name || ''}" oninput="siteData.profile.name = this.value"></div>
                    <div class="input-group"><label>Описание (Био)</label><input type="text" value="${siteData.profile?.bio || ''}" oninput="siteData.profile.bio = this.value"></div>
                </div>
            `;

            let linksHtml = '';
            siteData.links.forEach((link, index) => {
                linksHtml += `
                    <div class="admin-link-item">
                        <button class="btn-delete" onclick="deleteLink(${index})">Удалить</button>
                        <div class="input-group"><label>Иконка (Эмодзи)</label><input type="text" value="${link.icon}" oninput="updateField(${index}, 'icon', this.value)"></div>
                        <div class="input-group"><label>Название (RU)</label><input type="text" value="${link.title_ru}" oninput="updateField(${index}, 'title_ru', this.value)"></div>
                        <div class="input-group"><label>Название (UA)</label><input type="text" value="${link.title_ua}" oninput="updateField(${index}, 'title_ua', this.value)"></div>
                        <div class="input-group"><label>Ссылка (URL)</label><input type="text" value="${link.url}" oninput="updateField(${index}, 'url', this.value)"></div>
                        <div class="input-group"><label>Текст ссылки</label><input type="text" value="${link.display_url}" oninput="updateField(${index}, 'display_url', this.value)"></div>
                    </div>
                `;
            });

            content.innerHTML = `
                <h2>Настройки</h2>
                <div class="input-group"><label>GitHub Токен (для сохранения)</label><input type="password" id="ghToken" value="${localStorage.getItem('ghToken') || ''}"></div>
                <div style="max-height: 45vh; overflow-y: auto; padding-right: 5px; margin-top: 15px;" id="admin-links-list">
                    ${profileHtml}
                    ${linksHtml}
                </div>
                <button class="btn-add" onclick="addNewLink()">+ Добавить кнопку</button>
                <div class="admin-actions">
                    <button class="btn-cancel" onclick="document.getElementById('adminModal').classList.remove('active')">Отмена</button>
                    <button class="btn-primary" onclick="saveToGitHub()">Сохранить</button>
                </div>
                <div id="status" style="margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold;"></div>
            `;
        }

        function updateField(index, field, value) { siteData.links[index][field] = value; }
        function deleteLink(index) { if(confirm("Удалить эту ссылку?")) { siteData.links.splice(index, 1); renderAdminForm(); } }
        function addNewLink() {
            siteData.links.push({ icon: "🔗", title_ru: "НОВАЯ ССЫЛКА", title_ua: "НОВЕ ПОСИЛАННЯ", url: "https://", display_url: "link.com" });
            renderAdminForm();
            setTimeout(() => { const list = document.getElementById('admin-links-list'); list.scrollTop = list.scrollHeight; }, 100);
        }

        async function saveToGitHub() {
            const token = document.getElementById('ghToken').value.trim();
            const statusEl = document.getElementById('status');
            if (!token) { statusEl.innerText = "Введите токен!"; statusEl.style.color = "red"; return; }
            localStorage.setItem('ghToken', token);
            
            statusEl.innerText = "Сохранение..."; statusEl.style.color = "#fff";

            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data.json`;
            try {
                const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
                let sha = getRes.ok ? (await getRes.json()).sha : null;
                
                const jsonString = JSON.stringify(siteData, null, 2);
                const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "Обновление через админку", content: contentEncoded, sha: sha })
                });

                if (putRes.ok) {
                    statusEl.innerText = "УСПЕШНО СОХРАНЕНО!";
                    statusEl.style.color = "#4ade80";
                    setTimeout(() => { document.getElementById('adminModal').classList.remove('active'); loadData(); }, 1500);
                } else {
                    const err = await putRes.json();
                    statusEl.innerText = `Ошибка: ${err.message}`;
                    statusEl.style.color = "#ff4d4d";
                }
            } catch (e) { statusEl.innerText = "Ошибка сети."; statusEl.style.color = "#ff4d4d"; }
        }
        loadData();
    </script>
</body>
</html>
