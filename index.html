<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>offxll // UNDERGROUND</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --accent-red: #ff003c;
            --accent-green: #39ff14;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body {
            background-color: var(--bg-color); color: var(--text-color); min-height: 100vh;
            display: flex; justify-content: center; align-items: flex-start; padding: 20px 15px 80px 15px;
            background-image: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 60%);
            position: relative; overflow-x: hidden;
        }
        #browser-warning { display: none; background: #111; color: #fff; padding: 15px; text-align: center; border-bottom: 2px solid var(--accent-red); font-size: 14px; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .top-bar { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .lang-btn { background: transparent; color: var(--text-color); border: 1px solid #444; padding: 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; transition: 0.3s; }
        .lang-btn:hover { border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px rgba(57, 255, 20, 0.2); }
        .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; margin-top: 30px; }
        .avatar-container { position: relative; margin-bottom: 15px; }
        .avatar { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 2px solid #333; box-shadow: 0 0 20px rgba(255,0,60,0.3); background: #222; }
        .username { font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 1px; margin-bottom: 5px; text-transform: uppercase; }
        .bio { color: #888; font-size: 14px; margin-bottom: 25px; }
        .tag { border: 1px solid var(--accent-red); color: var(--accent-red); padding: 4px 10px; font-size: 12px; letter-spacing: 2px; margin-bottom: 20px; box-shadow: 0 0 10px rgba(255, 0, 60, 0.2); }
        .title { font-family: 'Oswald', sans-serif; font-size: 38px; line-height: 1.1; text-transform: uppercase; margin-bottom: 30px; text-align: center; }
        .title span { color: #fff; text-shadow: 2px 2px 0px var(--accent-red), -2px -2px 0px rgba(255,0,60,0.5); }
        .links-container { width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .link-card { 
            background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(10px);
            border-radius: 50px; padding: 15px 25px; display: flex; align-items: center; text-decoration: none; 
            color: var(--text-color); transition: all 0.3s ease; position: relative; overflow: hidden;
        }
        .link-card:hover { transform: translateY(-3px); border-color: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.4); background: rgba(255,255,255,0.1); }
        .icon-box { font-size: 24px; margin-right: 15px; }
        .link-content { flex-grow: 1; display: flex; flex-direction: column; }
        .link-title { font-family: 'Oswald', sans-serif; font-size: 18px; letter-spacing: 1px; }
        .link-url { font-size: 12px; color: #666; }
        .arrow { color: #fff; font-size: 20px; transition: 0.3s; }
        .link-card:hover .arrow { transform: translateX(5px); color: var(--accent-green); }
        .settings-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: #111; border: 1px solid #333; color: #fff; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 999; transition: 0.3s; }
        .settings-btn:hover { background: #222; border-color: var(--accent-red); transform: rotate(90deg); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #0a0a0a; border: 1px solid #333; padding: 25px; border-radius: 15px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 40px rgba(255,0,60,0.15); }
        .modal-content h2 { font-family: 'Oswald', sans-serif; color: var(--accent-red); text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: #fff; border-radius: 5px; font-family: monospace; }
        .input-group input:focus { outline: none; border-color: var(--accent-green); }
        .btn-primary { width: 100%; padding: 12px; background: var(--accent-red); color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-primary:hover { background: #d10031; }
        .btn-add { background: transparent; border: 1px dashed #444; color: #fff; width: 100%; padding: 10px; margin-bottom: 15px; cursor: pointer; border-radius: 5px; }
        .btn-add:hover { border-color: var(--accent-green); color: var(--accent-green); }
        .admin-link-item { border: 1px solid #222; padding: 15px; border-radius: 8px; margin-bottom: 15px; background: #111; position: relative; }
        .btn-delete { position: absolute; top: 10px; right: 10px; background: #300; color: #f00; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .admin-actions { display: flex; gap: 10px; margin-top: 20px; }
        .admin-actions button { flex: 1; }
        .btn-cancel { background: #333; color: #fff; border: none; padding: 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="browser-warning">
        <b style="color: #39ff14;">⚠️ Внимание:</b> Вы в браузере соцсети. Чтобы ссылки работали, нажмите <b>три точки (...)</b> и выберите <b>«Открыть в браузере»</b>.
    </div>

    <div class="top-bar">
        <button class="lang-btn" onclick="toggleLanguage()">УКР / РУС</button>
    </div>

    <div class="container">
        <div class="tag">// UNDERGROUND</div>
        
        <div class="avatar-container">
            <img src="" id="profileAvatar" class="avatar" alt="Avatar" onerror="this.src='https://via.placeholder.com/100?text=NO+PHOTO'">
        </div>
        <h1 class="username" id="profileName">offxll</h1>
        <div class="bio" id="profileBio">...</div>

        <h2 class="title">
            <span id="mainTitle">ЗАГРУЗКА...</span>
        </h2>

        <div class="links-container" id="linksContainer"></div>
    </div>

    <div class="settings-btn" onclick="openAdminModal()">⚙️</div>

    <div class="modal" id="adminModal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        const ADMIN_PASSWORD = "admin123"; 
        const GITHUB_USER = "offxll"; 
        const GITHUB_REPO = "bio";    
        
        let siteData = null;
        let currentLang = localStorage.getItem('siteLang') || 'ru';

        var ua = navigator.userAgent || navigator.vendor || window.opera;
        if (ua.indexOf("TikTok") > -1 || ua.indexOf("Instagram") > -1) {
            document.getElementById('browser-warning').style.display = 'block';
        }

        async function loadData() {
            try {
                const res = await fetch(`data.json?t=${Date.now()}`);
                siteData = await res.json();
                renderUI();
            } catch (e) {
                document.getElementById('linksContainer').innerHTML = `<p style="color:red">Ошибка загрузки.</p>`;
            }
        }

        function renderUI() {
            if(!siteData) return;
            if(siteData.profile) {
                document.getElementById('profileAvatar').src = siteData.profile.avatar;
                document.getElementById('profileName').innerText = siteData.profile.name;
                document.getElementById('profileBio').innerText = siteData.profile.bio;
            }

            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            
            siteData.links.forEach((link) => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "link-card";
                a.innerHTML = `
                    <div class="icon-box">${link.icon}</div>
                    <div class="link-content">
                        <div class="link-title" data-ru="${link.title_ru}" data-ua="${link.title_ua}">${link.title_ru}</div>
                        <div class="link-url">${link.display_url}</div>
                    </div>
                    <div class="arrow">→</div>
                `;
                container.appendChild(a);
            });
            setLanguage(currentLang);
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            if(!siteData) return;
            document.getElementById('mainTitle').innerText = lang === 'ru' ? siteData.title_ru : siteData.title_ua;
            document.querySelectorAll('.link-title').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });
        }
        function toggleLanguage() { setLanguage(currentLang === 'ru' ? 'ua' : 'ru'); }

        function openAdminModal() {
            const modal = document.getElementById('adminModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('active');
            content.innerHTML = `
                <h2>ВХОД</h2>
                <div class="input-group"><input type="password" id="adminPassword" placeholder="Пароль"></div>
                <button class="btn-primary" onclick="checkPassword()">ВОЙТИ</button>
            `;
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASSWORD) { renderAdminForm(); } 
            else { alert("Неверный пароль!"); }
        }

        function renderAdminForm() {
            const content = document.getElementById('modalContent');
            
            // Блок профиля
            let profileHtml = `
                <div class="admin-link-item" style="border-color: var(--accent-red);">
                    <h3 style="margin-bottom: 10px; color: var(--accent-red);">Профиль</h3>
                    <div class="input-group"><label>Ссылка на фото (URL или avatar.jpg)</label><input type="text" value="${siteData.profile?.avatar || ''}" oninput="siteData.profile.avatar = this.value"></div>
                    <div class="input-group"><label>Никнейм</label><input type="text" value="${siteData.profile?.name || ''}" oninput="siteData.profile.name = this.value"></div>
                    <div class="input-group"><label>Описание (Био)</label><input type="text" value="${siteData.profile?.bio || ''}" oninput="siteData.profile.bio = this.value"></div>
                </div>
            `;

            let linksHtml = '';
            siteData.links.forEach((link, index) => {
                linksHtml += `
                    <div class="admin-link-item">
                        <button class="btn-delete" onclick="deleteLink(${index})">✕</button>
                        <div class="input-group"><label>Иконка</label><input type="text" value="${link.icon}" oninput="updateField(${index}, 'icon', this.value)"></div>
                        <div class="input-group"><label>Название (РУС)</label><input type="text" value="${link.title_ru}" oninput="updateField(${index}, 'title_ru', this.value)"></div>
                        <div class="input-group"><label>Название (УКР)</label><input type="text" value="${link.title_ua}" oninput="updateField(${index}, 'title_ua', this.value)"></div>
                        <div class="input-group"><label>Ссылка (URL)</label><input type="text" value="${link.url}" oninput="updateField(${index}, 'url', this.value)"></div>
                        <div class="input-group"><label>Текст ссылки</label><input type="text" value="${link.display_url}" oninput="updateField(${index}, 'display_url', this.value)"></div>
                    </div>
                `;
            });

            content.innerHTML = `
                <h2>ПАНЕЛЬ УПРАВЛЕНИЯ</h2>
                <div class="input-group"><label>GitHub Токен (для сохранения)</label><input type="password" id="ghToken" placeholder="ghp_..." value="${localStorage.getItem('ghToken') || ''}"></div>
                <div style="max-height: 40vh; overflow-y: auto; padding-right: 5px; margin-top: 15px;" id="admin-links-list">
                    ${profileHtml}
                    ${linksHtml}
                </div>
                <button class="btn-add" onclick="addNewLink()">+ Добавить новую ссылку</button>
                <div class="admin-actions">
                    <button class="btn-cancel" onclick="document.getElementById('adminModal').classList.remove('active')">Отмена</button>
                    <button class="btn-primary" style="background: var(--accent-green); color: #000;" onclick="saveToGitHub()">Сохранить всё</button>
                </div>
                <div id="status" style="margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold;"></div>
            `;
        }

        function updateField(index, field, value) { siteData.links[index][field] = value; }
        function deleteLink(index) { if(confirm("Удалить?")) { siteData.links.splice(index, 1); renderAdminForm(); } }
        function addNewLink() {
            siteData.links.push({ icon: "🔗", title_ru: "Новая ссылка", title_ua: "Нове посилання", url: "https://", display_url: "example.com" });
            renderAdminForm();
            setTimeout(() => { const list = document.getElementById('admin-links-list'); list.scrollTop = list.scrollHeight; }, 100);
        }

        async function saveToGitHub() {
            const token = document.getElementById('ghToken').value.trim();
            const statusEl = document.getElementById('status');
            if (!token) { statusEl.innerText = "Введите токен!"; statusEl.style.color = "red"; return; }
            localStorage.setItem('ghToken', token);
            statusEl.innerText = "Сохранение..."; statusEl.style.color = "yellow";

            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data.json`;
            try {
                const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
                let sha = getRes.ok ? (await getRes.json()).sha : null;
                const jsonString = JSON.stringify(siteData, null, 2);
                const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "Обновление", content: contentEncoded, sha: sha })
                });

                if (putRes.ok) {
                    statusEl.innerText = "УСПЕШНО!";
                    statusEl.style.color = "var(--accent-green)";
                    setTimeout(() => { document.getElementById('adminModal').classList.remove('active'); loadData(); }, 1500);
                } else {
                    const err = await putRes.json();
                    statusEl.innerText = `Ошибка: ${err.message}`;
                    statusEl.style.color = "red";
                }
            } catch (e) { statusEl.innerText = "Ошибка сети."; statusEl.style.color = "red"; }
        }
        loadData();
    </script>
</body>
</html>
