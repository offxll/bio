<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>offxll // UNDERGROUND_NET</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #d4d4d4;
            --accent-green: #39ff14;
            --accent-red: #ff003c;
            --border-color: #333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* Контейнер для центрирования */
        .main-wrapper {
            position: relative;
            z-index: 10; /* Контент поверх матрицы */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px 80px 20px;
        }

        /* --- МАТРИЦА --- */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0; /* Самый задний план */
            opacity: 0.6; /* Яркость матрицы (можно уменьшить до 0.3) */
        }

        /* Затемнение по краям, чтобы текст было лучше видно */
        .matrix-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* Эффект CRT-монитора (скан-линии) */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Баннер для TikTok */
        #browser-warning { display: none; background: #000; color: var(--accent-green); padding: 15px; text-align: center; border-bottom: 1px solid var(--accent-green); font-size: 14px; position: fixed; top: 0; left: 0; width: 100%; z-index: 9999; }

        .top-bar { position: absolute; top: 20px; right: 20px; z-index: 100; }
        .lang-btn { background: #000; color: var(--text-color); border: 1px solid var(--border-color); padding: 5px 12px; font-size: 14px; cursor: pointer; transition: 0.3s; }
        .lang-btn:hover { border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 10px rgba(57, 255, 20, 0.2); }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; margin-top: 30px; }

        .terminal-header {
            border: 1px dashed var(--border-color);
            padding: 15px;
            margin-bottom: 30px;
            position: relative;
            background: rgba(0,0,0,0.7); /* Полупрозрачный фон для читаемости */
            backdrop-filter: blur(2px);
        }
        .terminal-header::before {
            content: "SYS_INFO.sys";
            position: absolute;
            top: -10px; left: 10px;
            background: #000;
            padding: 0 5px;
            color: #666;
            font-size: 12px;
        }

        .profile-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        
        .avatar {
            width: 60px; height: 60px;
            border: 1px solid var(--text-color);
            object-fit: cover;
            filter: grayscale(100%) contrast(120%);
        }
        .avatar.hidden { display: none; }

        .name-big { font-size: 28px; color: #fff; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        
        .terminal-text { font-size: 15px; line-height: 1.6; color: #888; }
        .terminal-text span { color: var(--accent-green); }

        /* Ссылки */
        .links-list { display: flex; flex-direction: column; gap: 8px; }
        
        .term-link {
            display: block;
            text-decoration: none;
            color: var(--text-color);
            font-size: 18px;
            padding: 8px 10px;
            transition: 0.2s;
            position: relative;
            border-bottom: 1px solid transparent;
            background: rgba(0,0,0,0.6); /* Читаемость на фоне матрицы */
        }
        
        .term-link::before { content: "[+] "; color: #555; }
        
        .term-link:hover {
            color: var(--accent-green);
            text-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
            border-bottom: 1px solid var(--accent-green);
            background: rgba(57, 255, 20, 0.1);
        }
        .term-link:hover::before { content: "[>] "; color: var(--accent-green); }
        
        .link-desc { font-size: 12px; color: #555; margin-left: 5px; }
        .term-link:hover .link-desc { color: var(--accent-green); }

        /* Шестеренка */
        .settings-btn { 
            position: fixed; bottom: 30px; right: 30px; 
            width: 50px; height: 50px; 
            background: #000; border: 1px solid var(--border-color); 
            color: #555; font-size: 24px; display: flex; justify-content: center; align-items: center; 
            cursor: pointer; z-index: 999; transition: 0.3s; 
        }
        .settings-btn:hover { border-color: var(--accent-green); color: var(--accent-green); box-shadow: 0 0 15px rgba(57, 255, 20, 0.3); }

        /* Модалка (Админка) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #000; border: 1px solid var(--accent-green); padding: 20px; width: 95%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: 0 0 20px rgba(57,255,20,0.1); z-index: 1001; }
        
        .modal-content h2 { color: var(--accent-green); margin-bottom: 20px; font-weight: normal; font-size: 18px; }
        .modal-content h2::before { content: "root@offxll:~# "; color: #fff; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #888; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 10px; background: #0a0a0a; border: 1px solid #333; color: var(--accent-green); font-family: monospace; }
        .input-group input:focus { outline: none; border-color: var(--accent-green); }
        
        .btn-primary { width: 100%; padding: 12px; background: var(--accent-green); color: #000; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-primary:hover { background: #2bc400; }
        .btn-add { background: transparent; border: 1px dashed #444; color: #888; width: 100%; padding: 10px; margin-bottom: 15px; cursor: pointer; }
        .btn-add:hover { border-color: var(--accent-green); color: var(--accent-green); }
        
        .admin-link-item { border: 1px solid #222; padding: 15px; margin-bottom: 15px; position: relative; }
        .btn-delete { position: absolute; top: 10px; right: 10px; background: transparent; color: var(--accent-red); border: 1px solid var(--accent-red); padding: 5px 10px; cursor: pointer; }
        .btn-delete:hover { background: var(--accent-red); color: #000; }
        .admin-actions { display: flex; gap: 10px; margin-top: 20px; }
        .admin-actions button { flex: 1; }
        .btn-cancel { background: #222; color: #888; border: none; padding: 12px; cursor: pointer; }
        .btn-cancel:hover { color: #fff; }
    </style>
</head>
<body>
    <!-- Канвас для матрицы (на самом деле сзади) -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- Затемнение, чтобы текст читался -->
    <div class="matrix-overlay"></div>

    <div id="browser-warning">
        <b>[SYSTEM_WARNING]</b> Вы в браузере соцсети. Для корректного перехода нажмите <b>(...)</b> и выберите <b>«Открыть в браузере»</b>.
    </div>

    <div class="top-bar">
        <button class="lang-btn" onclick="toggleLanguage()">[ LANG: RU ]</button>
    </div>

    <!-- Обертка для контента (чтобы он был поверх матрицы) -->
    <div class="main-wrapper">
        <div class="container">
            <div class="terminal-header">
                <div class="profile-row">
                    <img src="" id="profileAvatar" class="avatar" alt="Avatar" onerror="this.classList.add('hidden')">
                    <h1 class="name-big" id="profileName">offxll</h1>
                </div>
                <div class="terminal-text">
                    > STATUS: <span>ONLINE</span><br>
                    > BIO: <span id="profileBio">MONEY & CODE</span>
                </div>
            </div>

            <div class="links-list" id="linksContainer"></div>
        </div>
    </div>

    <div class="settings-btn" onclick="openAdminModal()">_</div>

    <div class="modal" id="adminModal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        // ===== МАТРИЦА (DIGITAL RAIN) =====
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        // Подгоняем размер холста под экран
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        const matrixChars = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const fontSize = 18; // Размер символов
        const columns = canvas.width / fontSize;
        
        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            // Очистка экрана с прозрачностью для эффекта шлейфа
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#0F0"; // Цвет символов
            ctx.font = fontSize + "px 'Share Tech Mono', monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = matrixChars.charAt(Math.floor(Math.random() * matrixChars.length));
                
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        // Скорость падения (меньше мс = быстрее)
        setInterval(drawMatrix, 40);

        // Пересчет при повороте экрана
        window.addEventListener('resize', () => {
            resizeCanvas();
        });


        // ===== ЛОГИКА САЙТА =====
        const ADMIN_PASSWORD = "admin123"; 
        const GITHUB_USER = "offxll"; 
        const GITHUB_REPO = "bio";    
        
        let siteData = null;
        let currentLang = localStorage.getItem('siteLang') || 'ru';

        var ua = navigator.userAgent || navigator.vendor || window.opera;
        if (ua.indexOf("TikTok") > -1 || ua.indexOf("Instagram") > -1) {
            document.getElementById('browser-warning').style.display = 'block';
        }

        async function loadData() {
            try {
                const res = await fetch(`data.json?t=${Date.now()}`);
                siteData = await res.json();
                renderUI();
            } catch (e) {
                document.getElementById('linksContainer').innerHTML = `<p style="color:red">ERROR: DATA_NOT_FOUND</p>`;
            }
        }

        function renderUI() {
            if(!siteData) return;
            if(siteData.profile) {
                if(siteData.profile.avatar && siteData.profile.avatar !== "") {
                    document.getElementById('profileAvatar').src = siteData.profile.avatar;
                    document.getElementById('profileAvatar').classList.remove('hidden');
                }
                document.getElementById('profileName').innerText = siteData.profile.name;
                document.getElementById('profileBio').innerText = siteData.profile.bio;
            }

            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            
            siteData.links.forEach((link) => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = "_blank";
                a.rel = "noopener noreferrer";
                a.className = "term-link";
                a.innerHTML = `
                    <span data-ru="${link.title_ru}" data-ua="${link.title_ua}">${link.title_ru}</span>
                    <span class="link-desc">// ${link.display_url}</span>
                `;
                container.appendChild(a);
            });
            setLanguage(currentLang);
        }

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            document.querySelector('.lang-btn').innerText = `[ LANG: ${lang.toUpperCase()} ]`;
            if(!siteData) return;
            document.querySelectorAll('[data-ru]').forEach(el => {
                el.innerText = el.getAttribute(`data-${lang}`);
            });
        }
        function toggleLanguage() { setLanguage(currentLang === 'ru' ? 'ua' : 'ru'); }

        // АДМИНКА
        function openAdminModal() {
            const modal = document.getElementById('adminModal');
            const content = document.getElementById('modalContent');
            modal.classList.add('active');
            content.innerHTML = `
                <h2>AUTH_REQUIRED</h2>
                <div class="input-group"><input type="password" id="adminPassword" placeholder="ENTER PASSWORD"></div>
                <button class="btn-primary" onclick="checkPassword()">EXECUTE</button>
            `;
            document.getElementById('adminPassword').focus();
        }

        function checkPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === ADMIN_PASSWORD) { renderAdminForm(); } 
            else { alert("ACCESS_DENIED"); }
        }

        function renderAdminForm() {
            const content = document.getElementById('modalContent');
            
            let profileHtml = `
                <div class="admin-link-item" style="border-color: var(--accent-green);">
                    <h3 style="margin-bottom: 10px; color: var(--accent-green);">PROFILE_CONFIG</h3>
                    <div class="input-group"><label>Photo URL (or avatar.jpg)</label><input type="text" value="${siteData.profile?.avatar || ''}" oninput="siteData.profile.avatar = this.value"></div>
                    <div class="input-group"><label>Nickname</label><input type="text" value="${siteData.profile?.name || ''}" oninput="siteData.profile.name = this.value"></div>
                    <div class="input-group"><label>Bio</label><input type="text" value="${siteData.profile?.bio || ''}" oninput="siteData.profile.bio = this.value"></div>
                </div>
            `;

            let linksHtml = '';
            siteData.links.forEach((link, index) => {
                linksHtml += `
                    <div class="admin-link-item">
                        <button class="btn-delete" onclick="deleteLink(${index})">DEL</button>
                        <div class="input-group"><label>Title (RU)</label><input type="text" value="${link.title_ru}" oninput="updateField(${index}, 'title_ru', this.value)"></div>
                        <div class="input-group"><label>Title (UA)</label><input type="text" value="${link.title_ua}" oninput="updateField(${index}, 'title_ua', this.value)"></div>
                        <div class="input-group"><label>URL</label><input type="text" value="${link.url}" oninput="updateField(${index}, 'url', this.value)"></div>
                        <div class="input-group"><label>Display URL</label><input type="text" value="${link.display_url}" oninput="updateField(${index}, 'display_url', this.value)"></div>
                    </div>
                `;
            });

            content.innerHTML = `
                <h2>SYS_CONFIG</h2>
                <div class="input-group"><label>GITHUB_TOKEN (ghp_...)</label><input type="password" id="ghToken" value="${localStorage.getItem('ghToken') || ''}"></div>
                <div style="max-height: 40vh; overflow-y: auto; padding-right: 5px; margin-top: 15px;" id="admin-links-list">
                    ${profileHtml}
                    ${linksHtml}
                </div>
                <button class="btn-add" onclick="addNewLink()">+ ADD_NEW_RECORD</button>
                <div class="admin-actions">
                    <button class="btn-cancel" onclick="document.getElementById('adminModal').classList.remove('active')">ABORT</button>
                    <button class="btn-primary" onclick="saveToGitHub()">COMMIT_CHANGES</button>
                </div>
                <div id="status" style="margin-top: 15px; font-size: 14px;"></div>
            `;
        }

        function updateField(index, field, value) { siteData.links[index][field] = value; }
        function deleteLink(index) { if(confirm("DELETE RECORD?")) { siteData.links.splice(index, 1); renderAdminForm(); } }
        function addNewLink() {
            siteData.links.push({ icon: "", title_ru: "NEW_LINK", title_ua: "NEW_LINK", url: "https://", display_url: "link.com" });
            renderAdminForm();
            setTimeout(() => { const list = document.getElementById('admin-links-list'); list.scrollTop = list.scrollHeight; }, 100);
        }

        async function saveToGitHub() {
            const token = document.getElementById('ghToken').value.trim();
            const statusEl = document.getElementById('status');
            if (!token) { statusEl.innerText = "> ERROR: TOKEN_REQUIRED"; statusEl.style.color = "var(--accent-red)"; return; }
            localStorage.setItem('ghToken', token);
            
            statusEl.innerText = "> UPLOADING..."; statusEl.style.color = "var(--accent-green)";

            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/data.json`;
            try {
                const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
                let sha = getRes.ok ? (await getRes.json()).sha : null;
                
                const jsonString = JSON.stringify(siteData, null, 2);
                const contentEncoded = btoa(unescape(encodeURIComponent(jsonString)));

                const putRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "SYS_UPDATE", content: contentEncoded, sha: sha })
                });

                if (putRes.ok) {
                    statusEl.innerText = "> SUCCESS: DATA_COMMITTED";
                    setTimeout(() => { document.getElementById('adminModal').classList.remove('active'); loadData(); }, 1500);
                } else {
                    const err = await putRes.json();
                    statusEl.innerText = `> ERROR: ${err.message}`;
                    statusEl.style.color = "var(--accent-red)";
                }
            } catch (e) { statusEl.innerText = "> ERROR: NETWORK_FAILURE"; statusEl.style.color = "var(--accent-red)"; }
        }
        loadData();
    </script>
</body>
</html>
